name: Build macOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: 检测 runner 架构
        id: arch
        run: echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: 修复 macOS 部署目标（Xcode 26 最低要求 11.0，原仓库写的 10.15/10.11 已不被支持）
        run: |
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 10.15;/MACOSX_DEPLOYMENT_TARGET = 11.0;/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/platform :osx, '10.15'/platform :osx, '11.0'/" macos/Podfile
          sed -i '' "s/s.platform = :osx, '10.11'/s.platform = :osx, '11.0'/" plugins/rhttp/rhttp/macos/rhttp.podspec
          if [ -f macos/Flutter/AppFrameworkInfo.plist ]; then
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 11.0" macos/Flutter/AppFrameworkInfo.plist || true
          fi

      - name: Get app dependencies
        run: flutter pub get

      - name: Get rhttp dependencies
        working-directory: plugins/rhttp/rhttp
        run: flutter pub get

      - name: Generate rhttp freezed files
        working-directory: plugins/rhttp/rhttp
        run: dart run build_runner build

      - name: Generate app files
        run: dart run build_runner build

      - name: Build macOS
        run: flutter build macos --release --no-pub

      - name: 打包 .app
        run: |
          cd build/macos/Build/Products/Release
          APP=$(ls -d *.app | head -1)
          mkdir -p dist
          zip -ry "dist/pixez-macos-${{ steps.arch.outputs.arch }}.zip" "$APP"

      - uses: actions/upload-artifact@v7
        with:
          name: pixez-macos-${{ steps.arch.outputs.arch }}
          path: dist/pixez-macos-${{ steps.arch.outputs.arch }}.zip
          compression-level: 0
